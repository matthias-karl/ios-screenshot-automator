name: Demo
options:
  bundleIdPrefix: dev.example.screenshotdemo
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  ios-screenshot-automator:
    path: ..
targets:
  Demo:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Demo, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.screenshotdemo.Demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
  DemoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [DemoUITests]
    dependencies:
      - target: Demo
      - package: ios-screenshot-automator
        product: ScreenshotAutomator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.screenshotdemo.DemoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Demo
        CODE_SIGNING_ALLOWED: NO
  DemoTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources: [DemoTV, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.screenshotdemo.DemoTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demo
        CODE_SIGNING_ALLOWED: NO
  DemoTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "18.0"
    sources: [DemoTVUITests]
    dependencies:
      - target: DemoTV
      - package: ios-screenshot-automator
        product: ScreenshotAutomator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.screenshotdemo.DemoTVUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DemoTV
        CODE_SIGNING_ALLOWED: NO
  DemoMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [DemoMac, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.screenshotdemo.DemoMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demo
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        ENABLE_APP_SANDBOX: NO
  DemoMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources: [DemoMacUITests]
    dependencies:
      - target: DemoMac
      - package: ios-screenshot-automator
        product: ScreenshotAutomator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.screenshotdemo.DemoMacUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DemoMac
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
schemes:
  Demo:
    build:
      targets:
        Demo: all
        DemoUITests: [test]
    test:
      targets: [DemoUITests]
  DemoTV:
    build:
      targets:
        DemoTV: all
        DemoTVUITests: [test]
    test:
      targets: [DemoTVUITests]
  DemoMac:
    build:
      targets:
        DemoMac: all
        DemoMacUITests: [test]
    test:
      targets: [DemoMacUITests]
